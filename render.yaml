# Render Blueprint (https://render.com/docs/blueprint-spec) for the campus-ai backend.
# Native Python runtime (no Dockerfile): see backend/README.md "Deploy to Render" for why, and for the
# values to enter for every `sync: false` variable below. Nothing secret is committed here.
services:
  - type: web
    name: campus-ai-backend
    runtime: python
    plan: free
    region: singapore          # nearest Render region to India; create the Neon project in AWS Singapore too
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: rate limits and per-conversation locks are in-process (README "Scaling").
    # --forwarded-allow-ips '*': only Render's proxy can reach the instance, and it sets X-Forwarded-For;
    # without this every student would share the proxy's IP for the per-IP registration limit.
    startCommand: uvicorn --factory app.api:create_app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # --- secrets: entered in the Render dashboard, never committed ---
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL         # Neon connection string, must include ?sslmode=require
        sync: false
      # --- deployment-specific settings: entered in the dashboard (see README checklist) ---
      - key: PUBLIC_BASE_URL      # https://<service-name>.onrender.com
        sync: false
      - key: DEV_MODE
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: USD_INR_RATE
        sync: false
      - key: MARGIN_PCT
        sync: false
      - key: PLATFORM_FEE_PCT
        sync: false
      - key: MAX_OUTPUT_TOKENS
        sync: false
      - key: CORS_ORIGINS         # the website's address, e.g. https://pavoai.in (no trailing slash). The website lives in its own repository.
        sync: false
