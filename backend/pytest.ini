[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*httpx2.*
asyncio_mode = auto
markers =
    postgres: runs against a real Postgres (Docker or TEST_DATABASE_URL); opt in with -m postgres
# Default run is SQLite only (fast, no setup). Postgres: pytest -m postgres. Everything: pytest -m "".
addopts = -m "not postgres"
